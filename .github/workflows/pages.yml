# Veröffentlicht die PWAs auf GitHub Pages.
#
# Einmalige Voraussetzung: Settings → Pages → Source „GitHub Actions“.
# Das Anlegen der Pages-Site kann der GITHUB_TOKEN des Workflows nicht selbst
# übernehmen (Resource not accessible by integration); `enablement: true`
# unten greift nur, falls das Repository es doch erlaubt.
#
# led-wall und osc sind reines HTML/JS und werden unverändert übernommen.
# prism und folio sind Vite-Projekte und werden hier gebaut; nur das
# Build-Ergebnis landet auf der Seite, nicht der Quellcode.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/led-wall-planning-pwa-t1mr04
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Rechenkern testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            prism/package-lock.json
            folio/package-lock.json

      - name: Tests der HTML-Apps
        run: npm test

      - name: Abhängigkeiten von Prism
        run: npm ci --prefix prism

      - name: Tests von Prism
        run: npm run test:prism

      - name: Typen von Prism prüfen
        run: npm run typecheck --prefix prism

      - name: Abhängigkeiten von Folio
        run: npm ci --prefix folio

      - name: Tests von Folio
        run: npm run test:folio

      - name: Typen von Folio prüfen
        run: npm run typecheck --prefix folio

  deploy:
    name: Deployen
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            prism/package-lock.json
            folio/package-lock.json

      - name: Prism bauen
        run: |
          npm ci --prefix prism
          npm run build --prefix prism

      - name: Folio bauen
        run: |
          npm ci --prefix folio
          npm run build --prefix folio

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/prism _site/folio
          # Alles außer dem Quellcode der gebauten Apps und den Metadaten
          # unverändert übernehmen, danach je App nur das Build-Ergebnis.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'prism' \
            --exclude 'folio' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            ./ _site/
          cp -r prism/dist/. _site/prism/
          cp -r folio/dist/. _site/folio/
          echo "--- _site ---"
          ls -la _site
          echo "--- _site/prism ---"
          ls -la _site/prism
          echo "--- _site/folio ---"
          ls -la _site/folio

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
